name: close-fixed

# Closes issues of this tracker once a merged nim-lang/nimony PR or a master
# commit says "Fixes <this repo>#N". See scripts/close_fixed.py.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: only print what would be closed
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/close_fixed.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKER: ${{ github.repository }}
