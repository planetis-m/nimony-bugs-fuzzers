name: fuzz

# Every third day: build nimony master once, then run the seven fuzzers side by
# side for 45 minutes each (as the original campaigns did) on fresh seeds. Each
# job uploads its findings and lists in its summary every finding line that
# matches nothing in known.txt. Toolchain setup follows
# planetis-m/test_nimony_native.

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: minutes per fuzzer (at most 90)
        default: '45'

permissions:
  contents: read

env:
  NIMONY_REPO: https://github.com/nim-lang/nimony

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.clone.outputs.commit }}
    steps:
      - name: Clone nimony master
        id: clone
        run: |
          git clone -q --depth 1 "$NIMONY_REPO" nimony
          echo "commit=$(git -C nimony rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the nimony toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: nimony/bin
          key: nimony-linux-amd64-${{ steps.clone.outputs.commit }}

      - if: steps.toolchain.outputs.cache-hit != 'true'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.4.x
          repo-token: ${{ github.token }}

      - name: Build the nimony toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: nimony
        # `build all` skips arkham + nifasm while ../nativenif is missing;
        # asking for arkham by name clones it at the pin first.
        run: |
          nim c -r src/hastur/hastur --release build arkham
          bin/hastur --release build all

  fuzz:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backends, src: backends/bfuzz,   run: 'backends/bfuzz --seed:$S --count:1000000 --time:$T --nimony:$N' }
          - { name: opt,      src: opt/optfuzz,      run: 'opt/optfuzz --seed:$S --count:1000000 --time:$T --nimony:$N' }
          - { name: closures, src: closures/clofuzz, run: 'timeout $T closures/clofuzz --seed:$S --count:1000000 --nimony:$N' }
          - { name: exc,      src: exc/excfuzz,      run: 'timeout $T exc/excfuzz --seed:$S --count:1000000 --nimony:$N' }
          - { name: arc,      src: arc/arcfuzz,      run: 'timeout $T arc/arcfuzz --seed:$S --count:1000000 --nimony:$N' }
          - { name: nifasm,   src: nifasm/asmfuzz,   run: 'nifasm/asmfuzz --seed:$S --minutes:$MIN --nifasm:$NB/nifasm' }
          # 4 GiB address-space cap per process (children inherit it), as the old prover had.
          - { name: prover,   src: prover/provfuzz,  run: 'prlimit --as=4294967296 prover/provfuzz --seed:$S --count:1000000 --minutes:$MIN --nimony:$N' }
    env:
      MIN: ${{ inputs.minutes || '45' }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: fz

      - name: Clone nimony at the built commit
        run: |
          git init -q nimony
          git -C nimony fetch -q --depth 1 "$NIMONY_REPO" "$COMMIT"
          git -C nimony checkout -q FETCH_HEAD

      - uses: actions/cache/restore@v6
        with:
          path: nimony/bin
          key: nimony-linux-amd64-${{ env.COMMIT }}
          fail-on-cache-miss: true

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.4.x
          repo-token: ${{ github.token }}

      - if: matrix.name == 'arc'
        run: sudo apt-get update -qq && sudo apt-get install -yq --no-install-recommends valgrind

      - name: Fuzz
        working-directory: fz/fuzzers
        run: |
          NB=$GITHUB_WORKSPACE/nimony/bin; N=$NB/nimony
          S=$(( $(date +%s) / 86400 * 1000 ))   # fresh seeds each day
          T=$(( MIN * 60 ))
          nim c -d:release --hints:off ${{ matrix.src }}.nim
          # The outer timeout also stops a reduction that overruns its budget.
          eval "timeout $(( T + 300 )) ${{ matrix.run }} --out:$RUNNER_TEMP/out --work:$RUNNER_TEMP/work" || true

      - name: Summary
        if: always()
        run: |
          grep -v '^#' fz/known.txt | grep . > known || true   # blank patterns would match everything
          cat $RUNNER_TEMP/out/*.csv 2>/dev/null | grep -v '^#' | grep -vF -f known > new || true
          echo "### ${{ matrix.name }}: $(wc -l < new) new (nimony $COMMIT)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s new ]; then { echo '```'; head -40 new; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ matrix.name }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore
