name: fuzz

# Every third day: build nimony master, run each fuzzer for a few minutes on
# fresh seeds, upload what they found. The job summary lists every finding line
# that matches nothing in known.txt. The prover is left out: too heavy for a
# runner. Toolchain setup follows planetis-m/test_nimony_native.

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: minutes per fuzzer
        default: '8'

permissions:
  contents: read

env:
  NIMONY_REPO: https://github.com/nim-lang/nimony

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MIN: ${{ inputs.minutes || '8' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: fz

      - name: Clone nimony master
        run: |
          git clone -q --depth 1 "$NIMONY_REPO" nimony
          echo "NIMONY_COMMIT=$(git -C nimony rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore the nimony toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: nimony/bin
          key: nimony-linux-amd64-${{ env.NIMONY_COMMIT }}

      # Nim builds the fuzzers too, so install it even on a cache hit.
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.4.x
          repo-token: ${{ github.token }}

      - name: Build the nimony toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: nimony
        # `build all` skips arkham + nifasm while ../nativenif is missing;
        # asking for arkham by name clones it at the pin first.
        run: |
          nim c -r src/hastur/hastur --release build arkham
          bin/hastur --release build all

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -yq --no-install-recommends valgrind

      - name: Fuzz
        run: |
          N=$PWD/nimony/bin/nimony
          O=$RUNNER_TEMP/out; W=$RUNNER_TEMP/work
          S=$(( $(date +%s) / 86400 * 1000 ))   # fresh seeds each day
          T=$(( MIN * 60 ))
          cd fz/fuzzers
          for f in backends/bfuzz opt/optfuzz closures/clofuzz exc/excfuzz arc/arcfuzz nifasm/asmfuzz; do
            nim c -d:release --hints:off $f.nim
          done
          # The outer timeout also stops a reduction that overruns its budget.
          run() { name=$1; shift; echo "::group::$name"; timeout $(( T + 120 )) "$@" --out:$O/$name --work:$W/$name || true; echo "::endgroup::"; }
          run backends backends/bfuzz --seed:$S --count:1000000 --time:$T --nimony:$N
          run opt      opt/optfuzz    --seed:$S --count:1000000 --time:$T --nimony:$N
          run closures timeout $T closures/clofuzz --seed:$S --count:1000000 --nimony:$N
          run exc      timeout $T exc/excfuzz      --seed:$S --count:1000000 --nimony:$N
          run arc      timeout $T arc/arcfuzz      --seed:$S --count:1000000 --nimony:$N
          run nifasm   nifasm/asmfuzz --seed:$S --minutes:$MIN --nifasm:$GITHUB_WORKSPACE/nimony/bin/nifasm

      - name: Summary
        if: always()
        run: |
          grep -v '^#' fz/known.txt | grep . > "$RUNNER_TEMP/known" || true
          echo "nimony $NIMONY_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP/out" 2>/dev/null || exit 0
          for d in */; do
            new=$(cat "$d"*.csv 2>/dev/null | grep -v '^#' | grep -vF -f "$RUNNER_TEMP/known" || true)
            n=$(printf '%s' "$new" | grep -c . || true)
            echo "### ${d%/}: $n new" >> "$GITHUB_STEP_SUMMARY"
            if [ "$n" -gt 0 ]; then printf '```\n%s\n```\n' "$(echo "$new" | head -40)" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-out
          path: ${{ runner.temp }}/out
          retention-days: 14
