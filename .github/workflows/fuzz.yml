name: fuzz

# Every third day: build nimony master once per platform, then run the fuzzers
# side by side for 45 minutes each (as the original campaigns did) on fresh
# seeds. bfuzz also runs on linux/arm64, macOS/arm64 and windows/amd64: one
# job per native code generator. Each job uploads its findings and lists in its
# summary every finding line that matches nothing in known.txt. Toolchain setup
# follows planetis-m/test_nimony_native.

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: minutes per fuzzer (at most 90)
        default: '45'

permissions:
  contents: read

env:
  NIMONY_REPO: https://github.com/nim-lang/nimony
  MINGW: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-llvm-23.1.3-mingw-w64msvcrt-14.0.0-r3.7z

defaults:
  run:
    shell: bash

jobs:
  head:
    # One commit for every build and fuzz job, even if master moves meanwhile.
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.head.outputs.commit }}
      nim: ${{ steps.head.outputs.nim }}
    steps:
      - id: head
        run: |
          echo "commit=$(git ls-remote "$NIMONY_REPO" HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          # newest Nim 2.4.x: the version setup-nim-action would pick, fixed once for the cache key
          echo "nim=$(git ls-remote --tags --refs https://github.com/nim-lang/Nim 'refs/tags/v2.4.*' |
                      sed 's|.*/v||' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: head
    strategy:
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: linux,   arch: arm64, runner: ubuntu-26.04-arm }
          - { os: macos,   arch: arm64, runner: macos-latest }
          - { os: windows, arch: amd64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      COMMIT: ${{ needs.head.outputs.commit }}
    steps:
      - run: git config --global core.autocrlf false

      - name: Clone nimony
        run: |
          git init -q nimony
          git -C nimony fetch -q --depth 1 "$NIMONY_REPO" "$COMMIT"
          git -C nimony checkout -q FETCH_HEAD

      - name: Restore the nimony toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          # upstream/: Nim's orc.nim, which the build fetches (git-ignored)
          path: |
            nimony/bin
            nimony/lib/std/system/upstream
          key: nimony3-${{ matrix.os }}-${{ matrix.arch }}-${{ env.COMMIT }}

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mingw.7z "$MINGW"
          7z x -y mingw.7z -o"$RUNNER_TEMP" > /dev/null
          echo "$RUNNER_TEMP/mingw64/bin" >> "$GITHUB_PATH"

      # setup-nim-action compiles Nim from source except on linux/amd64 and
      # Windows, and reinstalls every time, so keep its install in a cache.
      - name: Restore Nim
        id: nim
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .nim_runtime
          key: nim-${{ needs.head.outputs.nim }}-${{ matrix.os }}-${{ matrix.arch }}
      - if: steps.toolchain.outputs.cache-hit != 'true' && steps.nim.outputs.cache-hit != 'true'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ needs.head.outputs.nim }}
          repo-token: ${{ github.token }}
      - if: steps.toolchain.outputs.cache-hit != 'true' && steps.nim.outputs.cache-hit == 'true'
        run: echo "${{ github.workspace }}/.nim_runtime/bin" >> "$GITHUB_PATH"

      - name: Build the nimony toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: nimony
        # `build all` skips arkham + nifasm while ../nativenif is missing;
        # asking for arkham by name clones it at the pin first. jorogumo (the
        # JS and wasm backends) is not part of `all`.
        run: |
          nim c -r src/hastur/hastur --release build arkham
          bin/hastur --release build all
          bin/hastur --release build jorogumo

  fuzz:
    needs: [head, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backends, src: backends/bfuzz,   os: linux, arch: amd64, runner: ubuntu-latest, args: '--nimony:$N' }
          - { name: opt,      src: opt/optfuzz,      os: linux, arch: amd64, runner: ubuntu-latest, args: '--nimony:$N' }
          - { name: closures, src: closures/clofuzz, os: linux, arch: amd64, runner: ubuntu-latest, args: '--nimony:$N' }
          - { name: exc,      src: exc/excfuzz,      os: linux, arch: amd64, runner: ubuntu-latest, args: '--nimony:$N' }
          - { name: arc,      src: arc/arcfuzz,      os: linux, arch: amd64, runner: ubuntu-latest, args: '--nimony:$N' }
          - { name: nifasm,   src: nifasm/asmfuzz,   os: linux, arch: amd64, runner: ubuntu-latest, args: '--nifasm:$NB/nifasm' }
          # 4 GiB address-space cap per process (children inherit it), as the old prover had.
          - { name: prover,   src: prover/provfuzz,  os: linux, arch: amd64, runner: ubuntu-latest, args: '--nimony:$N',
              pre: 'prlimit --as=4294967296' }
          # The other native code generators, C as the oracle.
          - { name: backends-linux-arm64,   src: backends/bfuzz, os: linux,   arch: arm64, runner: ubuntu-26.04-arm, args: '--nimony:$N' }
          - { name: backends-macos-arm64,   src: backends/bfuzz, os: macos,   arch: arm64, runner: macos-latest,     args: '--nimony:$N --backends:c,n' }
          - { name: backends-windows-amd64, src: backends/bfuzz, os: windows, arch: amd64, runner: windows-latest,   args: '--nimony:$N --backends:c,n' }
    env:
      MIN: ${{ inputs.minutes || '45' }}
      COMMIT: ${{ needs.head.outputs.commit }}
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          path: fz

      - name: Clone nimony at the built commit
        run: |
          git init -q nimony
          git -C nimony fetch -q --depth 1 "$NIMONY_REPO" "$COMMIT"
          git -C nimony checkout -q FETCH_HEAD
          # programs built without -d:useLibc compile vendor/mimalloc
          git -C nimony submodule update -q --init --depth 1

      - uses: actions/cache/restore@v6
        with:
          path: |
            nimony/bin
            nimony/lib/std/system/upstream
          key: nimony3-${{ matrix.os }}-${{ matrix.arch }}-${{ env.COMMIT }}
          fail-on-cache-miss: true

      - name: Install MinGW (Windows)
        # `nimony c`, the oracle, needs a C compiler.
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o mingw.7z "$MINGW"
          7z x -y mingw.7z -o"$RUNNER_TEMP" > /dev/null
          echo "$RUNNER_TEMP/mingw64/bin" >> "$GITHUB_PATH"

      # setup-nim-action compiles Nim from source except on linux/amd64 and
      # Windows, and reinstalls every time, so keep its install in a cache.
      - name: Restore Nim
        id: nim
        uses: actions/cache@v6
        with:
          path: .nim_runtime
          key: nim-${{ needs.head.outputs.nim }}-${{ matrix.os }}-${{ matrix.arch }}
      - if: steps.nim.outputs.cache-hit != 'true'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ needs.head.outputs.nim }}
          repo-token: ${{ github.token }}
      - if: steps.nim.outputs.cache-hit == 'true'
        run: echo "${{ github.workspace }}/.nim_runtime/bin" >> "$GITHUB_PATH"

      - if: matrix.name == 'arc'
        run: sudo apt-get update -qq && sudo apt-get install -yq --no-install-recommends valgrind

      - name: Fuzz
        working-directory: fz/fuzzers
        # A reduction can overrun --minutes; this caps it.
        timeout-minutes: 100
        continue-on-error: true
        run: |
          NB=$GITHUB_WORKSPACE/nimony/bin; N=$NB/nimony
          S=$(( $(date +%s) / 86400 * 1000 ))   # fresh seeds each day
          nim c -d:release --hints:off ${{ matrix.src }}.nim
          ${{ matrix.pre }} ${{ matrix.src }} --seed:$S --count:1000000 --minutes:$MIN ${{ matrix.args }} \
            --out:$RUNNER_TEMP/out --work:$RUNNER_TEMP/work

      - name: Summary
        if: always()
        run: |
          grep -v '^#' fz/known.txt | grep . > known || true   # blank patterns would match everything
          cat $RUNNER_TEMP/out/*.csv 2>/dev/null | grep -v -e '^#' -e '^time_s,' | grep -vF -f known > new || true   # minus comments and CSV headers
          echo "### ${{ matrix.name }}: $(wc -l < new) new (nimony $COMMIT)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s new ]; then { echo '```'; head -40 new; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ matrix.name }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore
